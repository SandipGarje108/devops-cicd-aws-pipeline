name: Build and Push Docker Image

on:
  push:
    branches: [ main ]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/devops-cicd-demo .

    - name: Push Docker image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/devops-cicd-demo
- name: Deploy to EC2
  uses: appleboy/ssh-action@master
  with:
    host: ${{ secrets.EC2_HOST }}
    username: ${{ secrets.EC2_USER }}
    key: ${{ secrets.EC2_SSH_KEY }}
    script: |
      docker pull sandipgarje112/devops-cicd-demo
      docker stop devops-demo || true
      docker rm devops-demo || true
      docker run -d -p 5000:5000 --name devops-demo sandipgarje112/devops-cicd-demo
